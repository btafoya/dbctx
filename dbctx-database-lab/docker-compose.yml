x-db-env: &db-env
  TZ: ${DB_TIMEZONE}

services:
  postgres:
    image: postgres:17-alpine
    container_name: dbctx-postgres
    restart: unless-stopped
    profiles: ["all","postgres"]
    environment:
      <<: *db-env
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports: ["${POSTGRES_PORT}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dbctx]

  mariadb:
    image: mariadb:12.2.2
    container_name: dbctx-mariadb
    restart: unless-stopped
    profiles: ["all","mariadb"]
    environment:
      <<: *db-env
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports: ["${MARIADB_PORT}:3306"]
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD","mariadb-admin","ping","-h","localhost","-u","${DB_USERNAME}","-p${DB_PASSWORD}"]
    networks: [dbctx]

  mysql:
    image: mysql:8.4
    container_name: dbctx-mysql
    restart: unless-stopped
    profiles: ["all","mysql"]
    environment:
      <<: *db-env
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports: ["${MYSQL_PORT}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","${DB_USERNAME}","-p${DB_PASSWORD}"]
    networks: [dbctx]

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: dbctx-mssql
    restart: unless-stopped
    profiles: ["all","mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["${MSSQL_PORT}:1433"]
    volumes:
      - mssql_data:/var/opt/mssql
      - ./mssql/init:/init:ro
    networks: [dbctx]

  sqlite:
    image: alpine:3.22
    container_name: dbctx-sqlite
    restart: unless-stopped
    profiles: ["all","sqlite"]
    command: sh -c "apk add --no-cache sqlite && sqlite3 /data/app.db '.databases' && tail -f /dev/null"
    volumes:
      - sqlite_data:/data
      - ./sqlite:/workspace
    networks: [dbctx]

  adminer:
    image: adminer:latest
    container_name: dbctx-adminer
    restart: unless-stopped
    profiles: ["ui"]
    ports: ["${ADMINER_PORT}:8080"]
    networks: [dbctx]

networks:
  dbctx:

volumes:
  postgres_data:
  mariadb_data:
  mysql_data:
  mssql_data:
  sqlite_data:
