name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features --profile ci
      - run: cargo test --doc --all-features

  msrv:
    name: msrv ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check --all-targets --all-features

  docker-matrix:
    name: docker matrix (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.0
            env: DBCTX_TEST_MYSQL_IMAGE
          - image: mysql:8.4
            env: DBCTX_TEST_MYSQL_IMAGE
          - image: mariadb:10.11
            env: DBCTX_TEST_MARIADB_IMAGE
          - image: mariadb:11
            env: DBCTX_TEST_MARIADB_IMAGE
          - image: mcr.microsoft.com/mssql/server:2019-latest
            env: DBCTX_TEST_SQLSERVER_IMAGE
          - image: mcr.microsoft.com/mssql/server:2022-latest
            env: DBCTX_TEST_SQLSERVER_IMAGE
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: docker pull ${{ matrix.image }}
      - run: echo "${{ matrix.env }}=${{ matrix.image }}" >> "$GITHUB_ENV"
      - run: cargo nextest run --test introspection --all-features --profile ci
