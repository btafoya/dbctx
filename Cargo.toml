[package]
name = "dbctx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic database context for developers and AI coding agents"
repository = "https://github.com/btafoya/dbctx"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["database", "schema", "mysql", "sqlserver", "documentation"]
categories = ["command-line-utilities", "database"]

[lib]
name = "dbctx"
path = "src/lib.rs"

[[bin]]
name = "dbctx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
mysql_async = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
jsonschema = "0.30"
tiberius = "0.12"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1.42", features = ["json", "redactions"] }

[lints.rust]
# dbctx only ever reads catalog metadata; nothing here needs unsafe.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
