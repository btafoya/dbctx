[package]
name = "dbctx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic database context for developers and AI coding agents"
repository = "https://github.com/btafoya/dbctx"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["database", "schema", "mysql", "sqlserver", "documentation"]
categories = ["command-line-utilities", "database"]

[lib]
name = "dbctx"
path = "src/lib.rs"

[[bin]]
name = "dbctx"
path = "src/main.rs"

[lints.rust]
# dbctx only ever reads catalog metadata; nothing here needs unsafe.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
